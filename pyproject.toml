[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-writer"
version = "0.1.0"
description = "Google Sheets への書き込みで見切れ防止書式を機械的に担保する tool と検査役"
requires-python = ">=3.11"

[project.scripts]
sheet-writer = "sheet_writer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
